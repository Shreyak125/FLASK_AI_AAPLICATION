<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Chat Assistant</title>
<style>
  :root {
    --bg: #eef2f7;
    --surface: #ffffff;
    --text: #172033;
    --muted: #5d6b82;
    --border: #d9e0ea;
    --accent: #0f766e;
    --accent-hover: #0b5f58;
    --accent-soft: #e0f2f0;
    --focus: #14b8a6;
    --shadow: 0 10px 30px rgba(23, 32, 51, 0.08);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1522;
      --surface: #172033;
      --text: #e8edf5;
      --muted: #9aa8bf;
      --border: #2a3650;
      --accent: #2dd4bf;
      --accent-hover: #5eead4;
      --accent-soft: #12312f;
      --focus: #5eead4;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }

  .chat {
    width: 100%;
    max-width: 680px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 32px;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 1.75rem;
    letter-spacing: -0.02em;
  }

  .subtitle {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    font-size: 0.9rem;
  }

  textarea {
    width: 100%;
    min-height: 130px;
    resize: vertical;
    padding: 14px 16px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea::placeholder { color: var(--muted); }
  textarea:focus {
    outline: none;
    border-color: var(--focus);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--focus) 25%, transparent);
  }

  button {
    margin-top: 16px;
    width: 100%;
    padding: 14px 20px;
    font: inherit;
    font-weight: 600;
    color: #ffffff;
    background: var(--accent);
    border: 0;
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
  }
  @media (prefers-color-scheme: dark) {
    button { color: #06201d; }
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: translateY(1px); }
  button:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }

  /* Loading indicator.
     Shown while the button is pressed, or when the server adds
     class="is-loading" to the <main> element. */
  .loading {
    display: none;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
    padding: 12px 16px;
    color: var(--muted);
    font-size: 0.9rem;
    background: var(--accent-soft);
    border-radius: 14px;
  }
  form:has(button:active) ~ .loading,
  .is-loading .loading { display: flex; }

  .dots { display: inline-flex; gap: 5px; }
  .dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .dots span { animation: none; opacity: 0.7; }
  }

  .response {
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  .response h2 {
    margin: 0 0 12px;
    font-size: 1rem;
  }
  .response-body {
    min-height: 90px;
    padding: 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .response-body:empty::before {
    content: "Your response will appear here.";
    color: var(--muted);
  }

  @media (max-width: 480px) {
    .chat { padding: 22px 18px; border-radius: 20px; }
    h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>
  <main class="chat">
    <h1>AI Chat Assistant</h1>
    <p class="subtitle">Ask a question or describe what you need.</p>

    <form method="POST" action="/generate">
      <label for="prompt">Your prompt</label>
      <textarea id="prompt" name="prompt" placeholder="Type your prompt here..." required>{{user_prompt}}</textarea>
      <button type="submit">Generate Response</button>
    </form>

    <div class="loading" role="status" aria-live="polite">
      <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
      Generating your response...
    </div>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <section class="response" aria-labelledby="response-title">
      <h2 id="response-title">Response</h2>
      <div class="response-body" aria-live="polite">{{ai_response}}</div>
    </section>
  </main>
</body>
</html>
